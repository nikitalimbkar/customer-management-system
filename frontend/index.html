<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Customer Management System</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }


        /* ==============================
           HEADER
        ============================== */

        header {
            background: #2563eb;
            color: white;
            padding: 15px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            flex-wrap: wrap;
            gap: 10px;
        }

        header h1 {
            font-size: 22px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #usernameDisplay {
            font-weight: bold;
        }

        .logout-btn {
            background: white;
            color: #2563eb;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #e5e7eb;
        }


        /* ==============================
           MAIN
        ============================== */

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 25px auto;
        }


        /* ==============================
           DASHBOARD CARDS
        ============================== */

        .dashboard {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));

            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .card h3 {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
        }


        /* ==============================
           ACTION BAR
        ============================== */

        .actions {
            background: white;
            padding: 20px;
            border-radius: 10px;

            display: flex;
            flex-wrap: wrap;
            gap: 10px;

            margin-bottom: 20px;
        }

        .actions input,
        .actions select {

            padding: 11px;

            border: 1px solid #d1d5db;

            border-radius: 6px;

            min-width: 180px;
        }

        .actions button {
            padding: 11px 18px;

            border: none;

            border-radius: 6px;

            background: #2563eb;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        .actions button:hover {
            background: #1d4ed8;
        }


        /* ==============================
           CUSTOMER TABLE
        ============================== */

        .table-container {
            background: white;

            border-radius: 10px;

            padding: 20px;

            overflow-x: auto;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.08);
        }

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 850px;
        }

        th,
        td {

            padding: 12px;

            border-bottom: 1px solid #e5e7eb;

            text-align: left;
        }

        th {
            background: #f3f4f6;
        }

        tr:hover {
            background: #f9fafb;
        }


        /* ==============================
           STATUS
        ============================== */

        .status {

            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;
        }

        .status.NEW {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status.RENEW {
            background: #dcfce7;
            color: #15803d;
        }

        .status.PENDING {
            background: #fef3c7;
            color: #b45309;
        }

        .status.REJECTED {
            background: #fee2e2;
            color: #b91c1c;
        }


        /* ==============================
           BUTTONS
        ============================== */

        .btn {

            border: none;

            padding: 7px 11px;

            border-radius: 5px;

            cursor: pointer;

            margin-right: 4px;
        }

        .view-btn {
            background: #2563eb;
            color: white;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }


        /* ==============================
           MODAL
        ============================== */

        .modal {

            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.5);

            justify-content: center;
            align-items: center;

            padding: 20px;

            z-index: 1000;
        }

        .modal-content {

            background: white;

            width: 100%;

            max-width: 700px;

            max-height: 90vh;

            overflow-y: auto;

            border-radius: 10px;

            padding: 25px;

            position: relative;
        }

        .close {

            position: absolute;

            right: 20px;
            top: 15px;

            font-size: 25px;

            cursor: pointer;

            color: #6b7280;
        }

        .close:hover {
            color: #111827;
        }


        /* ==============================
           FORM
        ============================== */

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {

            display: block;

            margin-bottom: 6px;

            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {

            width: 100%;

            padding: 10px;

            border: 1px solid #d1d5db;

            border-radius: 6px;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-buttons {

            display: flex;

            gap: 10px;

            margin-top: 20px;
        }

        .primary-btn {

            background: #2563eb;

            color: white;

            border: none;

            padding: 11px 20px;

            border-radius: 6px;

            cursor: pointer;
        }

        .secondary-btn {

            background: #6b7280;

            color: white;

            border: none;

            padding: 11px 20px;

            border-radius: 6px;

            cursor: pointer;
        }


        /* ==============================
           PROFILE
        ============================== */

        .profile-row {

            display: grid;

            grid-template-columns: 180px 1fr;

            gap: 10px;

            padding: 10px 0;

            border-bottom: 1px solid #e5e7eb;
        }

        .profile-label {
            font-weight: bold;
        }


        /* ==============================
           DOCUMENTS
        ============================== */

        .documents {

            margin-top: 20px;
        }

        .documents h3 {
            margin-bottom: 10px;
        }

        .document-item {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            padding: 10px;

            border: 1px solid #e5e7eb;

            border-radius: 6px;

            margin-bottom: 8px;
        }

        .document-item a {

            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }


        /* ==============================
           MESSAGE
        ============================== */

        .message {

            padding: 12px;

            border-radius: 6px;

            margin-bottom: 15px;

            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            header {
                padding: 12px 15px;
            }

            header h1 {
                font-size: 18px;
            }

            .container {
                width: 94%;
            }

            .profile-row {
                grid-template-columns: 1fr;
                gap: 4px;
            }

            .actions input,
            .actions select,
            .actions button {
                width: 100%;
            }

            .modal-content {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header>

    <h1>
        Customer Management System
    </h1>

    <div class="header-right">

        <span>
            Welcome,
            <span id="usernameDisplay">
                User
            </span>
        </span>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>


<div class="container">


    <!-- ==========================================
         MESSAGES
    ========================================== -->

    <div
        id="successMessage"
        class="message success"
    ></div>

    <div
        id="errorMessage"
        class="message error"
    ></div>


    <!-- ==========================================
         DASHBOARD
    ========================================== -->

    <div class="dashboard">

        <div class="card">

            <h3>
                Total Customers
            </h3>

            <p id="totalCustomers">
                0
            </p>

        </div>


        <div class="card">

            <h3>
                New
            </h3>

            <p id="newCustomers">
                0
            </p>

        </div>


        <div class="card">

            <h3>
                Renew
            </h3>

            <p id="renewCustomers">
                0
            </p>

        </div>


        <div class="card">

            <h3>
                Pending
            </h3>

            <p id="pendingCustomers">
                0
            </p>

        </div>


        <div class="card">

            <h3>
                Rejected
            </h3>

            <p id="rejectedCustomers">
                0
            </p>

        </div>

    </div>


    <!-- ==========================================
         ACTIONS / SEARCH
    ========================================== -->

    <div class="actions">

        <input
            type="text"
            id="searchInput"
            placeholder="Search name, mobile, MH number..."
            oninput="loadCustomers()"
        >


        <select
            id="statusFilter"
            onchange="loadCustomers()"
        >

            <option value="">
                All Status
            </option>

            <option value="NEW">
                New
            </option>

            <option value="RENEW">
                Renew
            </option>

            <option value="PENDING">
                Pending
            </option>

            <option value="REJECTED">
                Rejected
            </option>

        </select>


        <select
            id="cityFilter"
            onchange="loadCustomers()"
        >

            <option value="">
                All Cities
            </option>

        </select>


        <button onclick="openAddCustomerModal()">

            + Add Customer

        </button>

        <button onclick="loadCustomers()">

            Refresh

        </button>

    </div>


    <!-- ==========================================
         CUSTOMER TABLE
    ========================================== -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>
                        ID
                    </th>

                    <th>
                        Name
                    </th>

                    <th>
                        Mobile
                    </th>

                    <th>
                        City
                    </th>

                    <th>
                        MH Number
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Actions
                    </th>

                </tr>

            </thead>


            <tbody id="customerTableBody">

                <tr>

                    <td
                        colspan="7"
                        style="text-align:center;"
                    >
                        Loading...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>



<!-- ==========================================
     ADD / EDIT CUSTOMER MODAL
========================================== -->

<div
    id="customerModal"
    class="modal"
>

    <div class="modal-content">

        <span
            class="close"
            onclick="closeCustomerModal()"
        >
            &times;
        </span>


        <h2 id="modalTitle">
            Add Customer
        </h2>


        <form id="customerForm">


            <input
                type="hidden"
                id="customerId"
            >


            <div class="form-group">

                <label>
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Mobile Number
                </label>

                <input
                    type="text"
                    id="mobile_number"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Address
                </label>

                <textarea
                    id="address"
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label>
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    MH Number
                </label>

                <input
                    type="text"
                    id="mh_number"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Aadhaar Number
                </label>

                <input
                    type="text"
                    id="aadhar_number"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Status
                </label>

                <select id="current_status">

                    <option value="NEW">
                        New
                    </option>

                    <option value="RENEW">
                        Renew
                    </option>

                    <option value="PENDING">
                        Pending
                    </option>

                    <option value="REJECTED">
                        Rejected
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Remarks
                </label>

                <textarea
                    id="remarks"
                ></textarea>

            </div>


            <div class="form-buttons">

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Save Customer
                </button>

                <button
                    type="button"
                    class="secondary-btn"
                    onclick="closeCustomerModal()"
                >
                    Cancel
                </button>

            </div>

        </form>

    </div>

</div>



<!-- ==========================================
     PROFILE MODAL
========================================== -->

<div
    id="profileModal"
    class="modal"
>

    <div class="modal-content">

        <span
            class="close"
            onclick="closeProfileModal()"
        >
            &times;
        </span>


        <h2>
            Customer Profile
        </h2>


        <div id="profileDetails">

            Loading...

        </div>


        <div class="documents">

            <h3>
                Documents
            </h3>

            <div id="documentsList">
                Loading...
            </div>

        </div>


        <div class="form-buttons">

            <button
                class="secondary-btn"
                onclick="closeProfileModal()"
            >
                Close
            </button>

        </div>

    </div>

</div>



<script>


// ======================================================
// API URL
// ======================================================

// IMPORTANT:
// Backend is deployed on Render.
// /api is included here because backend routes use /api/...

const API_URL =
    "https://customer-management-system-gful.onrender.com/api";


// Backend base URL without /api.
// Used for document files.

const BACKEND_URL =
    "https://customer-management-system-gful.onrender.com";


// ======================================================
// AUTHENTICATION
// ======================================================

const token =
    localStorage.getItem("token");


if (!token) {

    window.location.href = "login.html";

}


// ======================================================
// USERNAME
// ======================================================

const savedUsername =
    localStorage.getItem("username");

if (savedUsername) {

    document.getElementById(
        "usernameDisplay"
    ).textContent = savedUsername;

}


// ======================================================
// API HEADERS
// ======================================================

function getHeaders() {

    return {

        "Content-Type": "application/json",

        "Authorization":
            `Bearer ${token}`

    };

}


// ======================================================
// LOGOUT
// ======================================================

function logout() {

    localStorage.removeItem("token");

    localStorage.removeItem("username");

    window.location.href = "login.html";

}


// ======================================================
// MESSAGE FUNCTIONS
// ======================================================

function showSuccess(message) {

    const element =
        document.getElementById("successMessage");

    element.textContent = message;

    element.style.display = "block";


    setTimeout(() => {

        element.style.display = "none";

    }, 3000);

}


function showError(message) {

    const element =
        document.getElementById("errorMessage");

    element.textContent = message;

    element.style.display = "block";


    setTimeout(() => {

        element.style.display = "none";

    }, 5000);

}


// ======================================================
// LOAD DASHBOARD
// ======================================================

async function loadDashboard() {

    try {

        const response = await fetch(
            `${API_URL}/dashboard`,
            {
                headers: getHeaders()
            }
        );


        if (response.status === 401) {

            logout();

            return;

        }


        const data =
            await response.json();


        document.getElementById(
            "totalCustomers"
        ).textContent =
            data.total || 0;


        document.getElementById(
            "newCustomers"
        ).textContent =
            data.new || 0;


        document.getElementById(
            "renewCustomers"
        ).textContent =
            data.renew || 0;


        document.getElementById(
            "pendingCustomers"
        ).textContent =
            data.pending || 0;


        document.getElementById(
            "rejectedCustomers"
        ).textContent =
            data.rejected || 0;

    }
    catch (error) {

        console.error(
            "Dashboard error:",
            error
        );

    }

}


// ======================================================
// LOAD CITIES
// ======================================================

async function loadCities() {

    try {

        const response = await fetch(
            `${API_URL}/customers/cities`,
            {
                headers: getHeaders()
            }
        );


        if (response.status === 401) {

            logout();

            return;

        }


        const cities =
            await response.json();


        const select =
            document.getElementById(
                "cityFilter"
            );


        select.innerHTML =
            `<option value="">All Cities</option>`;


        cities.forEach(city => {

            const option =
                document.createElement("option");

            option.value = city.city;

            option.textContent = city.city;

            select.appendChild(option);

        });

    }
    catch (error) {

        console.error(
            "Cities error:",
            error
        );

    }

}


// ======================================================
// LOAD CUSTOMERS
// ======================================================

async function loadCustomers() {

    try {

        const search =
            document
                .getElementById("searchInput")
                .value
                .trim();


        const status =
            document
                .getElementById("statusFilter")
                .value;


        const city =
            document
                .getElementById("cityFilter")
                .value;


        let url =
            `${API_URL}/customers`;


        const params = new URLSearchParams();


        if (search) {

            params.append(
                "search",
                search
            );

        }


        if (status) {

            params.append(
                "status",
                status
            );

        }


        if (city) {

            params.append(
                "city",
                city
            );

        }


        if (params.toString()) {

            url +=
                "?" +
                params.toString();

        }


        const response =
            await fetch(
                url,
                {
                    headers: getHeaders()
                }
            );


        if (response.status === 401) {

            logout();

            return;

        }


        const customers =
            await response.json();


        const tbody =
            document.getElementById(
                "customerTableBody"
            );


        tbody.innerHTML = "";


        if (
            !customers ||
            customers.length === 0
        ) {

            tbody.innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        style="text-align:center;"
                    >
                        No customers found
                    </td>

                </tr>

            `;

            return;

        }


        customers.forEach(customer => {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${customer.customer_id}
                </td>

                <td>
                    ${escapeHtml(
                        customer.name
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        customer.mobile_number
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        customer.city
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        customer.mh_number
                    )}
                </td>

                <td>

                    <span
                        class="status ${customer.current_status}"
                    >
                        ${customer.current_status}
                    </span>

                </td>

                <td>

                    <button
                        class="btn view-btn"
                        onclick="viewCustomer(
                            ${customer.customer_id}
                        )"
                    >
                        View
                    </button>


                    <button
                        class="btn edit-btn"
                        onclick="editCustomer(
                            ${customer.customer_id}
                        )"
                    >
                        Edit
                    </button>


                    <button
                        class="btn delete-btn"
                        onclick="deleteCustomer(
                            ${customer.customer_id}
                        )"
                    >
                        Delete
                    </button>

                </td>

            `;


            tbody.appendChild(row);

        });

    }
    catch (error) {

        console.error(
            "Customers error:",
            error
        );

        showError(
            "Unable to load customers."
        );

    }

}


// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHtml(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }


    const div =
        document.createElement("div");

    div.textContent =
        String(value);

    return div.innerHTML;

}


// ======================================================
// OPEN ADD CUSTOMER MODAL
// ======================================================

function openAddCustomerModal() {

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Add Customer";


    document.getElementById(
        "customerForm"
    ).reset();


    document.getElementById(
        "customerId"
    ).value = "";


    document.getElementById(
        "customerModal"
    ).style.display =
        "flex";

}


// ======================================================
// CLOSE CUSTOMER MODAL
// ======================================================

function closeCustomerModal() {

    document.getElementById(
        "customerModal"
    ).style.display =
        "none";

}


// ======================================================
// ADD / EDIT CUSTOMER
// ======================================================

document
    .getElementById("customerForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const id =
                document.getElementById(
                    "customerId"
                ).value;


            const customerData = {

                name:
                    document.getElementById(
                        "name"
                    ).value.trim(),

                mobile_number:
                    document.getElementById(
                        "mobile_number"
                    ).value.trim(),

                address:
                    document.getElementById(
                        "address"
                    ).value.trim(),

                city:
                    document.getElementById(
                        "city"
                    ).value.trim(),

                mh_number:
                    document.getElementById(
                        "mh_number"
                    ).value.trim(),

                aadhar_number:
                    document.getElementById(
                        "aadhar_number"
                    ).value.trim(),

                current_status:
                    document.getElementById(
                        "current_status"
                    ).value,

                remarks:
                    document.getElementById(
                        "remarks"
                    ).value.trim()

            };


            try {

                let response;


                if (id) {

                    response =
                        await fetch(
                            `${API_URL}/customers/${id}`,
                            {
                                method: "PUT",

                                headers:
                                    getHeaders(),

                                body:
                                    JSON.stringify(
                                        customerData
                                    )
                            }
                        );

                }
                else {

                    response =
                        await fetch(
                            `${API_URL}/customers`,
                            {
                                method: "POST",

                                headers:
                                    getHeaders(),

                                body:
                                    JSON.stringify(
                                        customerData
                                    )
                            }
                        );

                }


                if (response.status === 401) {

                    logout();

                    return;

                }


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Operation failed"
                    );

                }


                closeCustomerModal();


                showSuccess(
                    id
                        ? "Customer updated successfully!"
                        : "Customer added successfully!"
                );


                await loadCustomers();

                await loadDashboard();

                await loadCities();

            }
            catch (error) {

                console.error(
                    "Save customer error:",
                    error
                );

                showError(
                    error.message ||
                    "Unable to save customer."
                );

            }

        }
    );


// ======================================================
// EDIT CUSTOMER
// ======================================================

async function editCustomer(id) {

    try {

        const response =
            await fetch(
                `${API_URL}/customers/${id}`,
                {
                    headers: getHeaders()
                }
            );


        if (response.status === 401) {

            logout();

            return;

        }


        const customer =
            await response.json();


        if (!response.ok) {

            throw new Error(
                customer.message ||
                "Unable to load customer"
            );

        }


        document.getElementById(
            "modalTitle"
        ).textContent =
            "Edit Customer";


        document.getElementById(
            "customerId"
        ).value =
            customer.customer_id;


        document.getElementById(
            "name"
        ).value =
            customer.name || "";


        document.getElementById(
            "mobile_number"
        ).value =
            customer.mobile_number || "";


        document.getElementById(
            "address"
        ).value =
            customer.address || "";


        document.getElementById(
            "city"
        ).value =
            customer.city || "";


        document.getElementById(
            "mh_number"
        ).value =
            customer.mh_number || "";


        document.getElementById(
            "aadhar_number"
        ).value =
            customer.aadhar_number || "";


        document.getElementById(
            "current_status"
        ).value =
            customer.current_status || "NEW";


        document.getElementById(
            "remarks"
        ).value =
            customer.remarks || "";


        document.getElementById(
            "customerModal"
        ).style.display =
            "flex";

    }
    catch (error) {

        console.error(
            "Edit error:",
            error
        );

        showError(
            error.message ||
            "Unable to load customer."
        );

    }

}


// ======================================================
// DELETE CUSTOMER
// ======================================================

async function deleteCustomer(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this customer?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/customers/${id}`,
                {
                    method: "DELETE",

                    headers: getHeaders()
                }
            );


        if (response.status === 401) {

            logout();

            return;

        }


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Delete failed"
            );

        }


        showSuccess(
            "Customer deleted successfully!"
        );


        await loadCustomers();

        await loadDashboard();

        await loadCities();

    }
    catch (error) {

        console.error(
            "Delete error:",
            error
        );

        showError(
            error.message ||
            "Unable to delete customer."
        );

    }

}

                    ${escapeHtml(customer.name)}
                </div>

            </div>


            <div class="profile-row">

                <div class="profile-label">
                    Mobile Number
                </div>

                <div>
                    ${escapeHtml(
                        customer.mobile_number
                    )}
                </div>

            </div>


            <div class="profile-row">

                <div class="profile-label">
                    Address
                </div>

                <div>
                    ${escapeHtml(
                        customer.address
                    )}
                </div>

            </div>


            <div class="profile-row">

                <div class="profile-label">
                    City
                </div>

                <div>
                    ${escapeHtml(
                        customer.city
                    )}
                </div>

            </div>


            <div class="profile-row">

                <div class="profile-label">
                    MH Number
                </div>

                <div>
                    ${escapeHtml(
                        customer.mh_number
                    )}
                </div>

            </div>


            <div class="profile-row">

                <div class="profile-label">

                <div>

                    )}
                </div>

            <div class="profile-row">

                <div class="profile-label">

                    <span

                </div>

            </div>

                <div class="profile-label">
                    Remarks
                </div>

                <div>
                    ${escapeHtml(
                        customer.remarks || "-"
                    )}
                </div>

            </div>


            <div class="profile-row">

                <div class="profile-label">
                    Created
                </div>

                <div>
                    ${
                        customer.created_at
                        ? new Date(
                            customer.created_at

                    }

        await loadDocuments(id);

    catch (error) {

        console.error(
            "Profile error:",

        );


        details.innerHTML =
            "Unable to load customer profile.";


        documents.innerHTML =

    }

}


// ======================================================
// LOAD DOCUMENTS
// ======================================================

async function loadDocuments(customerId) {

    const container =
        document.getElementById(
            "documentsList"
        );


    try {

        const response =
            await fetch(
                `${API_URL}/customers/${customerId}/documents`,
                {
                    headers: getHeaders()
                }
            );


        if (response.status === 401) {

            logout();

            return;

        }


        const docs =
            await response.json();


        if (
            !docs ||
            docs.length === 0
        ) {

            container.innerHTML =
                "<p>No documents uploaded.</p>";

            return;

        }


        container.innerHTML = "";


        docs.forEach(doc => {


            // IMPORTANT:
            // Use Render backend URL,
            // NOT localhost.

            const fileUrl =
                BACKEND_URL +
                doc.file_path;


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "document-item";


            item.innerHTML = `

                <span>
                    ${escapeHtml(
                        doc.document_name
                    )}
                </span>

                <a
                    href="${fileUrl}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    View
                </a>

            `;


            container.appendChild(item);

        });

    }
    catch (error) {

        console.error(
            "Documents error:",
            error
        );


        container.innerHTML =
            "<p>Unable to load documents.</p>";

    }

}


// ======================================================
// CLOSE PROFILE MODAL
// ======================================================

function closeProfileModal() {

    document.getElementById(
        "profileModal"
    ).style.display =
        "none";

}


// ======================================================
// CLOSE MODALS WHEN CLICKING OUTSIDE
// ======================================================

window.addEventListener(
    "click",
    function(event) {

        const customerModal =
            document.getElementById(
                "customerModal"
            );


        const profileModal =
            document.getElementById(
                "profileModal"
            );


        if (
            event.target === customerModal
        ) {

            closeCustomerModal();

        }


        if (
            event.target === profileModal
        ) {

            closeProfileModal();

        }

    }
);


// ======================================================
// INITIAL LOAD
// ======================================================

async function initialize() {

    await loadDashboard();

    await loadCities();

    await loadCustomers();

}


// Start application
initialize();
