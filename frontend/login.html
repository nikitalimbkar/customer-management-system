<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Customer Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8f0ff, #f7f9fc);
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 65px;
            height: 65px;
            margin: auto;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        h1 {
            text-align: center;
            margin-top: 15px;
            color: #1e293b;
            font-size: 25px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-top: 8px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #2563eb;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .login-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .error {
            display: none;
            background: #fee2e2;
            color: #b91c1c;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <div class="logo-icon">👤</div>

            <h1>Customer Management</h1>

            <p class="subtitle">
                Login to continue
            </p>
        </div>

        <div id="errorMessage" class="error"></div>

        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                    autocomplete="username"
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()">
                        Show
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginButton">

                Login

            </button>

        </form>

        <div class="footer">
            Customer Management System
        </div>

    </div>


<script>

const API_BASE_URL = "https://customer-management-system-gful.onrender.com/api";

const loginForm =
    document.getElementById("loginForm");

const errorMessage =
    document.getElementById("errorMessage");

const loginButton =
    document.getElementById("loginButton");


// CHECK IF ALREADY LOGGED IN

const existingToken =
    localStorage.getItem("authToken");

if (existingToken) {

    window.location.href = "index.html";

}


// LOGIN

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        errorMessage.style.display = "none";

        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;

        loginButton.disabled = true;

        loginButton.textContent = "Logging in...";

        try {

            const response =
                await fetch(`${API_URL}/login`, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })

                });


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Invalid username or password"
                );

            }


            // SAVE TOKEN

            localStorage.setItem(
                "authToken",
                data.token
            );


            localStorage.setItem(
                "username",
                data.user.username
            );


            // OPEN DASHBOARD

            window.location.href =
                "index.html";


        } catch (error) {

            errorMessage.textContent =
                error.message;

            errorMessage.style.display =
                "block";

        } finally {

            loginButton.disabled = false;

            loginButton.textContent =
                "Login";

        }

    }
);


// SHOW / HIDE PASSWORD

function togglePassword() {

    const passwordInput =
        document.getElementById("password");

    const button =
        document.querySelector(".show-password");


    if (passwordInput.type === "password") {

        passwordInput.type = "text";

        button.textContent = "Hide";

    } else {

        passwordInput.type = "password";

        button.textContent = "Show";

    }

}

</script>

</body>
</html>
