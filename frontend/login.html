<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Management - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #1f2937;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: #dc2626;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>Customer Management</h1>

        <p class="subtitle">
            Login to continue
        </p>

        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="loading" class="loading">
            Logging in...
        </div>

        <div id="errorMessage" class="error"></div>

    </div>

</div>


<script>

    // ==========================================
    // BACKEND API URL
    // ==========================================

    const API_BASE_URL =
        "https://customer-management-system-gful.onrender.com/api";


    // ==========================================
    // LOGIN
    // ==========================================

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const errorMessage =
                document.getElementById("errorMessage");

            const loading =
                document.getElementById("loading");

            errorMessage.style.display = "none";
            errorMessage.textContent = "";

            loading.style.display = "block";

            try {

                // IMPORTANT:
                // Use API_BASE_URL here
                const response = await fetch(
                    `${API_BASE_URL}/login`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );


                // Try to read JSON
                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message || "Login failed"
                    );

                }


                // ==========================================
                // SAVE JWT TOKEN
                // ==========================================

                localStorage.setItem(
                    "token",
                    data.token
                );


                // Save username
                localStorage.setItem(
                    "username",
                    username
                );


                // ==========================================
                // REDIRECT TO DASHBOARD
                // ==========================================

                window.location.href = "index.html";

            }
            catch (error) {

                console.error("Login error:", error);

                errorMessage.textContent =
                    error.message ||
                    "Unable to login. Please try again.";

                errorMessage.style.display = "block";

            }
            finally {

                loading.style.display = "none";

            }

        });

</script>

</body>
</html>
